[package]
name = "viper-run"
version = "2.0.0"
edition = "2021"
description = "Small retro F-16 cockpit flight game"
publish = false

[dependencies]
# Window, input and OpenGL loading only. On Linux it dlopens libGL/libX11 at
# runtime, so the binary needs no development libraries to build or run.
miniquad = "=0.4.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Terrain generation at startup is too slow without optimisation.
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
# Already pulled in by miniquad; used to dlopen PulseAudio/ALSA at runtime.
libc = "0.2"

[lints.rust]
# rustc always passes -Wl,-O1 to GNU-style linkers in release builds, and the
# Zig linker used by cargo-zigbuild reports it as deprecated on every link.
linker_messages = "allow"
