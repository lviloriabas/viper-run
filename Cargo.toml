[package]
name = "viper-run"
version = "2.0.0"
edition = "2021"
description = "Procedural cockpit combat flight game with flight school and multiplayer"
publish = false
default-run = "viper-run"

[dependencies]
# Window, input and OpenGL loading only. On Linux it dlopens libGL/libX11 at
# runtime, so the binary needs no development libraries to build or run.
miniquad = "=0.4.11"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.16"
miniz_oxide = "=0.9.1"
igd-next = "=0.18.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Terrain generation at startup is too slow without optimisation.
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
# Already pulled in by miniquad; used to dlopen PulseAudio/ALSA at runtime.
libc = "0.2"

[lints.rust]
warnings = "deny"
linker_messages = "deny"
