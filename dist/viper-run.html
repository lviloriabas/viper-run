:root {
  --ink: #050807;
  --panel: #0a110e;
  --panel-2: #101a15;
  --line: #31473a;
  --line-hot: #6e9b6d;
  --green: #9dffa7;
  --acid: #d8ff86;
  --amber: #ffc05b;
  --red: #ff6d5f;
  --cyan: #79e8df;
  --cream: #ece8cd;
  --dim: #7b957e;
  --mono: "Silkscreen", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: var(--green);
  font-family: var(--mono);
  -webkit-font-smoothing: none;
  user-select: none;
}

body { position: fixed; inset: 0; }
body.playing { cursor: none; }
body.paused, body.menu { cursor: default; }

#app { position: absolute; inset: 0; overflow: hidden; }

#world, #cockpit {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#world { z-index: 1; background: #283b4a; }
#cockpit { z-index: 3; pointer-events: none; }

.crt-wash {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(2, 8, 5, 0.14) 0px,
      rgba(2, 8, 5, 0.14) 1px,
      transparent 1px,
      transparent 3px
    );
  opacity: 0.42;
  mix-blend-mode: multiply;
}
.crt-wash::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255, 40, 20, 0.015), rgba(20, 255, 150, 0.012), rgba(40, 80, 255, 0.015));
  animation: crt-drift 9s steps(2, end) infinite;
}
@keyframes crt-drift {
  0%, 96% { opacity: 0.2; }
  97% { opacity: 0.32; }
  98% { opacity: 0.15; }
  100% { opacity: 0.22; }
}

.vignette {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 46%, transparent 44%, rgba(0, 0, 0, 0.16) 74%, rgba(0, 0, 0, 0.52) 110%),
    linear-gradient(180deg, rgba(0, 0, 0, 0.24), transparent 16%, transparent 75%, rgba(0, 0, 0, 0.33));
}

#ui {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}
#ui > * { pointer-events: auto; }

/* ------------------------------------------------------------------ menus */

.screen {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: clamp(16px, 3.2vw, 48px);
  overflow: auto;
  background:
    radial-gradient(ellipse at 73% 26%, rgba(123, 168, 83, 0.08), transparent 46%),
    linear-gradient(105deg, rgba(3, 7, 5, 0.95) 0%, rgba(3, 7, 5, 0.84) 48%, rgba(3, 7, 5, 0.46) 100%);
  animation: screen-in 280ms steps(4, end) both;
}
@keyframes screen-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.menu-shell {
  position: relative;
  width: min(1180px, 94vw);
  border: 1px solid rgba(157, 255, 167, 0.28);
  background:
    linear-gradient(135deg, rgba(31, 52, 37, 0.18), transparent 42%),
    rgba(4, 10, 7, 0.79);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 28px 90px rgba(0, 0, 0, 0.6), inset 0 0 60px rgba(74, 117, 75, 0.06);
  clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 34px 100%, 0 calc(100% - 34px));
  padding: clamp(22px, 3.2vw, 48px);
}
.menu-shell::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(145, 187, 124, 0.1);
  pointer-events: none;
  clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
}
.menu-shell::after {
  content: "";
  position: absolute;
  top: -1px;
  left: 44px;
  width: 150px;
  height: 2px;
  background: var(--acid);
  box-shadow: 0 0 18px rgba(216, 255, 134, 0.8);
}

.menu-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(107, 145, 102, 0.22);
  padding-bottom: 16px;
}
.menu-topline .lights { display: flex; gap: 7px; align-items: center; }
.menu-topline .lamp { width: 7px; height: 7px; background: var(--acid); box-shadow: 0 0 8px rgba(216, 255, 134, 0.8); }
.menu-topline .lamp.red { background: var(--red); box-shadow: 0 0 8px rgba(255, 109, 95, 0.75); }
.menu-topline .lamp.dim { background: #384a3a; box-shadow: none; }

.menu-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
  gap: clamp(30px, 5vw, 74px);
  align-items: end;
  padding: clamp(28px, 4.5vw, 58px) 0 clamp(20px, 3vw, 38px);
}

.kicker {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--amber);
  font-size: clamp(8px, 0.9vw, 11px);
  letter-spacing: 0.25em;
  line-height: 1.6;
  text-transform: uppercase;
  margin-bottom: 18px;
}
.kicker::before { content: ""; width: 38px; height: 1px; background: currentColor; opacity: 0.7; }

h1.title {
  margin: 0;
  font-family: var(--mono);
  font-weight: 700;
  font-size: clamp(58px, 10.2vw, 136px);
  line-height: 0.78;
  letter-spacing: -0.055em;
  color: var(--cream);
  text-transform: uppercase;
  text-shadow:
    3px 3px 0 rgba(0, 0, 0, 0.8),
    0 0 34px rgba(157, 255, 167, 0.12);
}
h1.title span {
  display: block;
  color: var(--acid);
  margin-left: 0.34em;
  text-shadow:
    3px 3px 0 rgba(0, 0, 0, 0.8),
    0 0 44px rgba(216, 255, 134, 0.22);
}
h1.title .slash {
  display: inline-block;
  margin: 0 0.08em 0 0;
  color: var(--amber);
  font-size: 0.58em;
  vertical-align: 0.28em;
  letter-spacing: 0;
}

.title-rule {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 22px 0 0;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: 0.17em;
  text-transform: uppercase;
}
.title-rule::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, var(--line), transparent); }

.mission-copy {
  max-width: 600px;
  margin: 26px 0 30px;
  color: #b8c8ad;
  font-size: clamp(10px, 1.1vw, 13px);
  line-height: 1.85;
  letter-spacing: 0.02em;
}
.mission-copy strong { color: var(--acid); font-weight: 400; }
.mission-copy em { color: var(--amber); font-style: normal; }

.cta-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

.btn {
  appearance: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  color: #071008;
  background: var(--acid);
  font-size: clamp(10px, 1vw, 13px);
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  padding: 17px 25px;
  clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 13px 100%, 0 calc(100% - 13px));
  box-shadow: 0 0 26px rgba(216, 255, 134, 0.15);
  transition: transform 90ms steps(2, end), background 100ms linear, color 100ms linear;
}
.btn:hover, .btn:focus-visible { background: #f0ffd0; outline: 1px solid var(--cream); outline-offset: 4px; transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn small { font-size: 0.72em; color: #416030; margin-left: 12px; }
.btn.ghost {
  color: var(--green);
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line-hot);
