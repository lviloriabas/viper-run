<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>VIPER RUN // F-16C</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <canvas id="world" aria-hidden="true"></canvas>
  <canvas id="cockpit" aria-hidden="true"></canvas>
  <div class="crt-wash" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="ui" role="application" aria-label="Viper Run flight simulator"></div>
  <div id="boot" aria-live="polite">
    <span class="boot-mark">V//R</span>
    <span class="boot-text">INITIALIZING FLIGHT CONTROL COMPUTER</span>
  </div>
  <noscript><p class="noscript">VIPER RUN requires JavaScript and WebGL 2.</p></noscript>
</main>
<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
